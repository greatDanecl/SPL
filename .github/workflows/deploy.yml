name: Build & Deploy SPL Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'data/**.xlsx'
      - 'data/**.xls'
      - 'docs/index.html'
      - 'scripts/build_data.py'
      - 'data_parser.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data.json
        run: python scripts/build_data.py

      - name: Copy logo to docs/
        run: cp -n SPL_logo.png docs/ 2>/dev/null || true

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/SPL_logo.png
          git diff --cached --quiet || git commit -m "chore: update data.json [skip ci]"
          git push

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dadaa537229a95be521e821cf9f02f97
